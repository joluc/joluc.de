#-------------------------------
# General Site Settings
baseURL = "https://joluc.de"
languageCode = "en-us"
title = "Joluc.de - Cloud Engineering & Observability"

[pagination]
  pagerSize = 6

theme = ["hugo-flex", "hugo-shortcode-gallery"]
timeout = 60000

[params]
  logo = "/images/WS.webp"
  author = "Jonathan"
  description = "Cloud engineer specializing in observability and signals. Passionate about building monitoring systems that transform telemetry data into actionable insights for production environments."
  galleryLoadJQuery = true

  # SEO Settings
  schema = true
  opengraph = true

  # Default social image for Open Graph
  images = ["/images/og-default.jpg"]

[imaging.exif]
  includeFields = ".*"

#-------------------------------
# Main Menu
[menu]
  [[menu.main]]
    identifier = "home"
    name = "home"
    url = "/"
    weight = 1

  [[menu.main]]
    identifier = "blog"
    name = "blog"
    url = "/blog/"
    weight = 2

  [[menu.main]]
    identifier = "lab"
    name = "lab"
    url = "/lab/"
    weight = 3

  [[menu.main]]
    identifier = "about"
    name = "about"
    url = "/about/"
    weight = 4

  [[menu.main]]
    identifier = "contact"
    name = "contact"
    url = "/contact/"
    weight = 5

#-------------------------------
# Hero Settings
[params.hero]
  hero__title = "Hi, I'm joluc!"
  hero__description = "Cloud-native software developer with a deep love for signals, data patterns, and crafting meaning from noise. I live at the intersection of code,  infrastructure, and observability, transforming metrics, logs and traces into systems that guide teams from chaos → clarity → decisions."

#-------------------------------
# Portfolio Settings
[params.portfolio]
  portfolio__title = "Signals"

#-------------------------------
# Footer Settings
[[params.social]]
  icon = "ion-logo-github"
  name = "GitHub"
  link = "https://github.com/joluc"
  color = "#333333"

[[params.social]]
  icon = "ion-logo-linkedin"
  name = "LinkedIn"
  link = "https://linkedin.com/in/joluc"
  color = "#0077b5"

[[params.social]]
  icon = "ion-logo-instagram"
  name = "Instagram"
  link = "https://instagram.com/joluc"
  color = "#e4405f"

#-------------------------------
# Contact Settings
[params.contact]
  email = "contact@joluc.de"

#-------------------------------
# Markup Settings
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[markup.highlight]
  codeFences = true
  guessSyntax = true
  noClasses = false

[permalinks]
  blog = "/blog/:year/:month/:slug/"
