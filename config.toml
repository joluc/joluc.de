#-------------------------------
# General Site Settings
baseURL = "https://joluc.de"
languageCode = "en-us"
title = "Joluc.de - Cloud Engineering & Observability"
googleAnalytics = "G-SPZ7BV0K85" # Add your identifier. For example UA-99631805-1.
[pagination]
  pagerSize = 6
theme = ["hugo-flex", "hugo-shortcode-gallery"]
timeout = 60000
[params]
  logo = "/images/WS.webp" # You can add own logo. For example "/images/logo.png".
  author = "Jonathan"
  description = "Cloud engineer specializing in observability and signals. Passionate about building monitoring systems that transform telemetry data into actionable insights for production environments."
  galleryLoadJQuery = true

  # SEO Settings
  schema = true
  opengraph = true

  # Default social image for Open Graph
  images = ["/images/og-default.jpg"]

[imaging.exif]
    includeFields = ".*"
#-------------------------------
# Main Menu
[menu]
  [[menu.main]]
    identifier = "home"
    name = "home"
    url = "/"
    weight = 1

  [[menu.main]]
    identifier = "blog"
    name = "blog"
    url = "/posts/"
    weight = 2

  [[menu.main]]
    identifier = "homelab"
    name = "lab"
    url = "/homelab/"
    weight = 3

  [[menu.main]]
    identifier = "about"
    name = "about"
    url = "/about/"
    weight = 4

  [[menu.main]]
    identifier = "contact"
    name = "contact"
    url = "/contact/"
    weight = 5

  #[[menu.main]]
  #  identifier = "elements"
  #  name = "Elements"
  #  url = "/elements/"
  #  weight = 5


  #-------------------------------
  # Hero Settings
  [params.hero]
    hero__title = "Hey, I am joluc!"
    hero__description = "Cloud-native software developer with a deep love for signals, data patterns, and crafting meaning from noise. I live at the intersection of code,  infrastructure, and observability, transforming metrics, logs and traces into systems that guide teams from chaos → clarity → decisions."


  #-------------------------------
  # Portfolio Settings
  [params.portfolio]
    portfolio__title = "Portfolio"

  [[params.gallery_item]]
    image = "/images/gallery-image.jpg"
    title = "Observability Stack"
    description = "Complete monitoring setup with Prometheus, Grafana, and custom dashboards"

  [[params.gallery_item]]
    image = "/images/gallery-image.jpg"
    title = "Distributed Tracing"
    description = "Jaeger-based tracing system for microservices architecture"

  [[params.gallery_item]]
    image = "/images/gallery-image.jpg"
    title = "Cloud Infrastructure"
    description = "Kubernetes cluster with comprehensive monitoring and alerting"


