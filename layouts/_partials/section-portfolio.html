{{- /* begin portfolio */ -}}
<section class="section portfolio">
  <div class="container">
    <div class="row">
      <div class="col col-12">
        <div class="section__head">
          <h2 class="section__title">{{ .Site.Params.portfolio.portfolio__title }}</h2>
          <div class="portfolio__view">
            <div class="portfolio__refresh" title="Refresh Charts">
              <img src="/images/refresh.png" alt="Refresh" class="refresh-icon">
            </div>
            <a href="/lab/homelab" class="portfolio__info" title="More Info About Signals">
              <span class="info-text">i</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <div class="portfolio__gallery animate">
    <div class="container">
      <div class="row" id="charts-row">
        <div class="col col-4 col-d-6 col-t-12">
          <div class="chart-label" id="label-0"></div>
          <div class="chart-status" id="status-0">Loading...</div>
          <div class="chart-container"><canvas id="chart-0"></canvas></div>
        </div>
        <div class="col col-4 col-d-6 col-t-12">
          <div class="chart-label" id="label-1"></div>
          <div class="chart-status" id="status-1">Loading...</div>
          <div class="chart-container"><canvas id="chart-1"></canvas></div>
        </div>
        <div class="col col-4 col-d-6 col-t-12">
          <div class="chart-label" id="label-2"></div>
          <div class="chart-status" id="status-2">Loading...</div>
          <div class="chart-container"><canvas id="chart-2"></canvas></div>
        </div>
      </div>
    </div>
  </div>

  {{- $portfolioJs := resources.Get "js/portfolio.js" -}}
  {{- if eq hugo.Environment "development" -}}
  <script src="{{ $portfolioJs.Permalink }}"></script>
  {{- else -}}
  <script src="{{ ($portfolioJs | minify | fingerprint).RelPermalink }}"></script>
  {{- end -}}
</section>
{{- /* end portfolio */ -}}
